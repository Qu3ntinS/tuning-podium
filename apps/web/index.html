<!doctype html>
<html lang="de" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1714" />
    <meta name="description" content="Abstimmung für Tuningtreffen — Top 3 Voting per QR-Code." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Tuning Podium</title>
    <script>
      try {
        const raw = localStorage.getItem("podium-theme");
        let preference = "auto";

        if (raw) {
          try {
            preference = JSON.parse(raw);
          } catch {
            preference = raw.replace(/"/g, "");
          }
        }

        const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        const isDark =
          preference === "dark" || (preference !== "light" && prefersDark);

        document.documentElement.classList.remove("dark", "light");
        document.documentElement.classList.add(isDark ? "dark" : "light");
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
